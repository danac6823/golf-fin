<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>高球隊財務(預覽)</title>
<style>
:root{--navy:#1F3864;--bg:#F5F6F8;--card:#fff;--line:#E3E6EB;--txt:#1c1c1e;--sub:#6b7280;
--blue:#E6F1FB;--blueT:#0C447C;--green:#EAF3DE;--greenT:#27500A;--amber:#FAEEDA;--amberT:#633806;
--purple:#EEEDFE;--purpleT:#3C3489;--red:#FCEBEB;--redT:#791F1F;}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--txt);padding:14px;max-width:480px;margin:0 auto}
h1{font-size:17px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--blue);color:var(--blueT);display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.sub{font-size:12px;color:var(--sub)}
.bal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.bal div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.bal p{font-size:11px;color:var(--sub)}
.bal b{font-size:15px;font-weight:600}
.tpls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.tpls button{padding:12px 10px;font-size:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt)}
.tpls button:active{background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:11px;padding:3px 9px;border-radius:999px}
.c-pool{background:var(--blue);color:var(--blueT)}
.c-team{background:var(--green);color:var(--greenT)}
.c-cat{background:var(--amber);color:var(--amberT)}
.c-ref{background:var(--purple);color:var(--purpleT)}
.c-note{background:var(--red);color:var(--redT)}
input,select,button.btn{width:100%;padding:11px;font-size:15px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px}
button.btn{background:var(--navy);color:#fff;border:none;font-weight:600}
button.btn:disabled{opacity:.5}
button.ghost{background:#fff;color:var(--txt);border:1px solid var(--line)}
.log .item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:6px}
.log .top{display:flex;justify-content:space-between;font-size:13px}
.amt-in{color:#27500A;font-weight:600}.amt-out{font-weight:600}
.voided{opacity:.45;text-decoration:line-through}
.toast{position:sticky;top:8px;z-index:9;background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;display:none;margin-bottom:10px}
#loginView{margin-top:18vh;text-align:center}
#loginView .card{text-align:left}
.hide{display:none}
label{font-size:12px;color:var(--sub)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 0 max(10px,env(safe-area-inset-bottom));z-index:50}
.nav button{flex:1;border:none;background:none;text-align:center;padding:4px 0;position:relative;margin:0;border-radius:0}
.nav .ic{font-size:21px;display:block;line-height:1.2}
.nav .lb{font-size:10.5px;color:var(--sub)}
.nav .on .lb{color:#1F3864;font-weight:600}
.nav .bdg{position:absolute;top:-2px;right:22%;background:#C0392B;color:#fff;font-size:10px;border-radius:999px;padding:1px 6px;font-weight:600}
.sheetBk{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-radius:16px 16px 0 0;padding:14px 14px max(16px,env(safe-area-inset-bottom));z-index:61}
.sheet button{width:100%;text-align:left;padding:13px 12px;margin:0 0 6px;font-size:14px;border:1px solid var(--line);border-radius:10px;background:#fff}
body.appOn{padding-bottom:92px}
</style>
</head>

<div id="loginView" class="hide"></div>

<div id="mainView">

  </div>

  <div id="pageHead" class="hide" style="margin-bottom:12px">

  </div>

  <div id="homeSec">

  <datalist id="memberList"></datalist>

  </div>

  <div id="reconSec" class="hide">

    </div>

  <div id="entrySec">

      <div style="display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff">

    <div class="log" id="log"></div>

</div>

function api(payload){
  return new Promise(function(res,rej){ setTimeout(function(){
    if(payload.action==='whoami') res({name:user});
    else if(payload.action==='summary') res({balances:MOCK.balances, recent:MOCK.recent, overview:MOCK.overview, reqs:MOCK.reqs, recon:MOCK.recon, pubs:MOCK.pubs||[], vendors:MOCK.vendors||[]});
    else if(payload.action==='add'){
      var en=payload.entry, id='T'+('00'+(MOCK.seqT++)).slice(-3), ref='';
      if(en.refType==='R') ref='R12-'+('00'+(MOCK.seqR++)).slice(-3);
      if(en.refType==='F') ref='F12-'+('00'+(MOCK.seqF++)).slice(-3);
      MOCK.balances[en.pool] += (en.income||0)-(en.expense||0);
      MOCK.recent.unshift({id:id,date:en.date,pool:en.pool,team:en.team,cat:en.cat,desc:en.desc,
        income:en.income||0,expense:en.expense||0,ref:ref,status:'—',note:'',voided:false});
      res({txnId:id, ref:ref});
    }
    else if(payload.action==='sponsorTransfer'){
      if(user!=='允甄'){ rej(new Error('銀行轉帳回報為財務(允甄)專屬')); return; }
      var refS='F12-'+('00'+(MOCK.seqF++)).slice(-3), amtS=payload.amount;
      MOCK.balances['[私]Lina贊助池']-=amtS; MOCK.balances['[主]會費池']+=amtS;
      MOCK.overview.lina.toTeam+=amtS; MOCK.overview.lina.balance-=amtS;
      var idA='T'+('00'+(MOCK.seqT++)).slice(-3), idB='T'+('00'+(MOCK.seqT++)).slice(-3);
      MOCK.recent.unshift({id:idB,date:payload.date,pool:'[主]會費池',team:'創主班',cat:'贊助收入',
        desc:'麗娜會長贊助(李麗娜,自Lina池轉入)',income:amtS,expense:0,ref:refS,status:'—',note:payload.note||'',voided:false});
      MOCK.recent.unshift({id:idA,date:payload.date,pool:'[私]Lina贊助池',team:'創主班',cat:'贊助轉出',
        desc:'轉入球隊帳(贊助創業主班)',income:0,expense:amtS,ref:refS,status:'已撥款',note:payload.note||'',voided:false});
      res({ref:refS, txnIds:[idA,idB]});
    }
    else if(payload.action==='reqCreate'){
      var q=payload.req, ref='R12-'+('00'+(MOCK.seqR++)).slice(-3);
      MOCK.reqs.unshift({ref:ref,applyDate:20260808,applicant:user==='凌華'?'張凌華':'張允甄',
        pool:q.pool,team:q.team,cat:q.cat,desc:q.desc,amount:q.amount,payee:q.payee,
        bankCode:q.bankCode,bankAcct:q.bankAcct,payDate:'',status:'待匯款',vendorNotified:'—',note:q.note});
      mockPush('允甄','💸 新付款請求 '+ref,
        [['項目',q.desc],['金額','NT$ '+q.amount.toLocaleString()],['收款戶名',q.payee],['帳號',(q.bankCode?q.bankCode+' ':'')+(q.bankAcct||'')]],
        [['查看明細',{ref:ref}],['確認已匯款',{ref:ref,act:'pay'}]]);
      res({ref:ref});
    }
    else if(payload.action==='reqPay'){
      var r=MOCK.reqs.find(function(x){return x.ref===payload.ref});
      if(user!=='允甄'){ rej(new Error('匯款回報為財務(允甄)專屬')); return; }
      r.status='已匯款'; r.payDate=20260808;
      MOCK.balances[r.pool]-=r.amount;
      var id2='T'+('00'+(MOCK.seqT++)).slice(-3);
      MOCK.recent.unshift({id:id2,date:20260808,pool:r.pool,team:r.team,cat:r.cat,desc:r.desc,
        income:0,expense:r.amount,ref:r.ref,status:'已撥款',note:'付款請求自動入帳',voided:false});
      mockPush('凌華','✅ 允甄已匯款 '+r.ref,
        [['項目',r.desc],['金額','NT$ '+r.amount.toLocaleString()],['匯款日','20260808']],
        [['查看明細',{ref:r.ref}],['已通知廠商・結案',{ref:r.ref,act:'close'}]]);
      res({ref:r.ref,txnId:id2});
    }
    else if(payload.action==='members'){
      if(user==='麗娜'){ rej(new Error('會員名冊含個資,僅總幹事與財務可查')); return; }
      res({members:MOCK.members});
    }
    else if(payload.action==='publishMonth'){
      if(user!=='允甄'){ rej(new Error('月報發布為財務(允甄)專屬')); return; }
      MOCK.pubs=MOCK.pubs||[];
      MOCK.pubs=MOCK.pubs.filter(function(p){return p.ym!==payload.ym});
      MOCK.pubs.push({ym:payload.ym,by:'允甄',at:'08/08 22:40'});
      res({ym:payload.ym,closing:410887,reconOk:false});
    }
    else if(payload.action==='memberConfirm'){
      if(user!=='允甄'){ rej(new Error('收款確認為財務(允甄)專屬')); return; }
      var mm=MOCK.members.find(function(x){return x.id===payload.memberId});
      if(mm.status==='已繳'){ rej(new Error(mm.name+' 已是已繳狀態')); return; }
      mm.status='已繳'; mm.confirm='20260808';
      var idM='T'+('00'+(MOCK.seqT++)).slice(-3);
      MOCK.recent.unshift({id:idM,date:20260808,pool:'[主]會費池',team:'創主班',cat:'會費收入',
        desc:'會費收入('+mm.name+')',income:mm.due,expense:0,ref:'',status:'—',note:'會員查詢確認收款',voided:false,fy:2026});
      recalcMock();
      res({memberId:mm.id,txnId:idM,amount:mm.due});
    }
    else if(payload.action==='memberSync'){
      res({added:0,updated:0});
    }
    else if(payload.action==='reconCommit'){
      var asf=0;
      MOCK.recent.forEach(function(r){ if(!r.voided&&r.pool===payload.pool&&Number(r.date)<=payload.stmtDate) asf+=r.income-r.expense; });
      if(payload.actual-asf!==0){ rej(new Error('差異 '+(payload.actual-asf)+' 元,不可勾稽')); return; }
      MOCK.recent.forEach(function(r){ if(!r.voided&&r.pool===payload.pool&&Number(r.date)<=payload.stmtDate&&!r.rec) r.rec=true; });
      MOCK.recon[payload.pool]={date:payload.stmtDate,actual:payload.actual,by:user};
      res({batch:'RC-'+payload.stmtDate,stamped:1,asof:asf});
    }
    else if(payload.action==='editEntry'){
      var er=MOCK.recent.find(function(x){return x.id===payload.txnId});
      var ch=payload.changes;
      if(er.rec && ch.pool && ch.pool!==er.pool){ rej(new Error('此筆已完成銀行勾稽,不可變更資金池')); return; }
      if(ch.cat==='球秘請款'||ch.cat==='球秘執行費') ch.team='創主班';
      er.pool=ch.pool||er.pool; er.team=ch.team||er.team; er.cat=ch.cat||er.cat;
      if('fy' in ch) er.fy = ch.fy===''?null:ch.fy;
      if('act' in ch) er.act = ch.act;
      er.edited=true; recalcMock();
      res({txnId:er.id,changed:true});
    }
    else if(payload.action==='void'){
      var vr=MOCK.recent.find(function(x){return x.id===payload.txnId});
      if(vr.rec){ rej(new Error('此筆已完成銀行勾稽,不可作廢')); return; }
      vr.voided=true; recalcMock();
      res({txnId:vr.id});
    }
    else if(payload.action==='reqClose'){
      var r2=MOCK.reqs.find(function(x){return x.ref===payload.ref});
      r2.status='已結案'; r2.vendorNotified='已通知'; MOCK.lastPush=null;
      res({ref:r2.ref});
    }
  }, 200); });
}

  api({action:'members'}).then(function(j){
    memberCache=j.members;
    var dl=document.getElementById('memberList');
    dl.innerHTML=memberCache.map(function(m){return '<option value="'+esc(m.name)+'">'}).join('');

function publishMonth(ym){
  var rc=(lastData.recon||{})['[主]會費池'];
  var warn = (!rc || Number(rc.date) < Number(ym.replace('-',''))*100+28)
    ? '\n⚠️ 該月尚未完成銀行對帳勾稽,建議先勾稽再發布(仍可發布)。' : '';

  (lastData.recent||[]).forEach(function(r){
    if(r.voided||r.pool!=='[主]會費池'||r.cat!=='贊助收入') return;
    if(String(r.date).slice(0,6)!==ym.replace('-','')) return;
    if(String(r.desc).indexOf('暫不公開')>=0) return;
    sp.push(r.desc);
  });
  var spWarn = sp.length ? '\n🙏 芳名錄將公開(本名・須已逐位確認):\n・'+sp.join('\n・')+
    '\n(未經本人同意者請先在該筆明細加註「暫不公開」)' : '';
  if(!confirm('發布 '+ym.replace('-','年')+'月 月報至公開網頁?'+warn+spWarn)) return;
  api({action:'publishMonth',ym:ym}).then(function(j){
    var link=REPORT_URL+'?ym='+ym;
    var msg='⛳ 第12屆高球隊 '+ym.replace('-','年')+'月財務月報已發布\n期末結餘 NT$ '+money(j.closing)+'\n'+link;

  }).catch(function(e){ toast('失敗:'+e.message); });
}

var RECON_MINE={'允甄':['[主]會費池','[私]Lina贊助池'],'凌華':['[私]花零用金池'],'麗娜':[]};
var RECON_TEAM_DEFAULT={'[主]會費池':'創主班','[私]Lina贊助池':'共用','[私]花零用金池':'創12'};
var reconInput={};

function asofBal(pool, ymd){
  var s=0;
  (lastData.recent||[]).forEach(function(r){
    if(!r.voided && r.pool===pool && Number(r.date)<=ymd) s+=r.income-r.expense;
  });
  return s;
}

function renderRecon(){
  var el=document.getElementById('reconBody');
  if(!lastData){ el.innerHTML='<p class="sub">載入中…</p>'; return; }
  var mine=RECON_MINE[user]||[];
  if(!mine.length){ el.innerHTML='<p class="sub">您沒有需勾稽的資金池</p>'; return; }
  var today=new Date().toISOString().slice(0,10);
  var h='<p class="sub" style="margin-bottom:8px">'+
    (user==='允甄'?'只有你看得到銀行明細——填入銀行實際餘額,差異=0 才能蓋勾稽章':'零用金實點金額填入,差異=0 即可勾稽')+'</p>';
  mine.forEach(function(p,idx){
    var st=reconInput[p]||{date:today,actual:''};
    var ymd=Number((st.date||today).replace(/-/g,''));
    var asof=asofBal(p,ymd);
    var actual=st.actual===''?null:Number(st.actual);
    var diff=actual===null?null:actual-asof;
    var last=(lastData.recon||{})[p];
    h+='<div class="card">';
    h+='<b style="font-size:14px">'+p+'</b>';
    h+=last?'<p class="sub">上次勾稽:'+last.date+'・餘額 '+money(last.actual)+'・'+last.by+'</p>'
           :'<p class="sub">尚未勾稽過</p>';
    h+='<label>對帳日</label><input type="date" value="'+(st.date||today)+'" onchange="reconSet(\''+p+'\',\'date\',this.value)">';
    h+='<div style="display:flex;justify-content:space-between;font-size:13px;margin:4px 0"><span class="sub">截至該日帳面餘額</span><b>'+money(asof)+'</b></div>';
    h+='<label>'+(user==='允甄'?'銀行實際餘額':'實點現金餘額')+'</label>'+
       '<input type="number" inputmode="numeric" placeholder="輸入實際餘額" value="'+st.actual+'" oninput="reconSet(\''+p+'\',\'actual\',this.value)">';
    if(diff===null) h+='<p class="sub">填入實際餘額後顯示差異</p>';
    else if(diff===0){
      h+='<p style="font-size:14px;font-weight:600;color:#27500A;margin:4px 0">✓ 差異 0,可勾稽</p>';
      h+='<button class="btn" onclick="reconCommit(\''+p+'\')">✓ 完成勾稽(蓋檢查點,該日前帳目鎖定)</button>';
    } else {
      h+='<p style="font-size:14px;font-weight:600;color:#A32D2D;margin:4px 0">差異 '+(diff>0?'+':'')+money(diff)+' 元</p>';
      if(diff>0) h+='<button class="ghost" style="margin-bottom:6px" onclick="reconQuickFix(\''+p+'\','+diff+',1)">一鍵補記:利息收入 +'+money(diff)+'</button>';
      else h+='<button class="ghost" style="margin-bottom:6px" onclick="reconQuickFix(\''+p+'\','+(-diff)+',0)">一鍵補記:手續費 −'+money(-diff)+'</button>';
      h+='<p class="sub">其他可能:有一筆尚未入帳、或金額打錯——到明細頁核對該池近期紀錄</p>';
    }
    h+='</div>';
  });
  el.innerHTML=h;
}

function reconSet(pool,k,v){
  reconInput[pool]=reconInput[pool]||{};
  reconInput[pool][k]=v;
  renderRecon();
}

function reconQuickFix(pool,amt,isIncome){
  var kind=isIncome?'利息收入':'銀行手續費';
  if(!confirm('補記一筆:'+pool+' '+kind+' NT$ '+money(amt)+'(今日)?')) return;
  api({action:'add',entry:{
    date:new Date().toISOString().slice(0,10).replace(/-/g,''),
    pool:pool, team:RECON_TEAM_DEFAULT[pool],
    cat:isIncome?'利息':'手續費',
    desc:kind+'(對帳補記)',
    income:isIncome?amt:'', expense:isIncome?'':amt,
    refType:'', status:isIncome?'—':'已支付', note:'對帳勾稽時補記'
  }}).then(function(){ toast('已補記,差異應歸零'); refresh(); })
    .catch(function(e){ toast('失敗:'+e.message); });
}

function reconCommit(pool){
  var st=reconInput[pool]||{};
  var ymd=Number((st.date||new Date().toISOString().slice(0,10)).replace(/-/g,''));
  api({action:'reconCommit',pool:pool,actual:Number(st.actual),stmtDate:ymd}).then(function(j){
    toast('✓ 勾稽完成 '+j.batch+',已鎖定 '+j.stamped+' 筆');
    reconInput[pool]={}; refresh();
  }).catch(function(e){ toast('失敗:'+e.message); });
}

var deepLink = (function(){
  var sp = new URLSearchParams(location.search);
  var d = { ref: sp.get('ref'), act: sp.get('act') };
  if (d.ref) history.replaceState(null,'',location.pathname);
  return d.ref ? d : null;
})();

function handleDeepLink(){
  if(!deepLink || !lastData) return;
  var dl = deepLink; deepLink = null;
  showTab('pay');
  var r = (lastData.reqs||[]).find(function(x){ return x.ref===dl.ref; });
  setTimeout(function(){
    var el = document.getElementById('req-'+dl.ref);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'});
      el.style.boxShadow='0 0 0 3px #F0C36D'; setTimeout(function(){el.style.boxShadow='';},2500); }
    if(!r) return;
    if(dl.act==='pay'){
      if(user!=='允甄'){ toast('確認匯款為財務(允甄)專屬'); return; }
      if(r.status!=='待匯款'){ toast(dl.ref+' 已處理過'); return; }
      if(confirm('確認已由「'+r.pool+'」匯出 NT$ '+money(r.amount)+' 給「'+r.payee+'」?\n按下後自動入帳。')) reqPay(dl.ref);
    }
    if(dl.act==='close'){
      if(user!=='凌華'){ toast('結案為凌華專屬'); return; }
      if(r.status!=='已匯款'){ toast(dl.ref+' 狀態非已匯款'); return; }
      if(confirm('確認已通知廠商,將 '+dl.ref+' 結案?')) reqClose(dl.ref);
    }
  }, 350);
}

  });

      b.onclick=function(){ setOvView(vv[0]) }; subEl.appendChild(b);
    });
  }
  var body=document.getElementById('ovBody');
  if(!lastData){ body.innerHTML='<p class="sub">載入中…</p>'; return; }
  var o=lastData.overview, bal=lastData.balances, h='';
  if(ovView==='flow'){
    h='<p class="sub" style="margin-bottom:6px">錢從哪來、到哪去——每個節點與箭頭都可點入明細</p>'+
      '<div class="card" style="padding:10px 6px">'+buildFlowSvg(o,bal)+'</div>';
    body.innerHTML=h;
    body.onclick=function(ev){
      var c=ev.target.closest('[data-drill]');
      if(c){ var d=JSON.parse(c.getAttribute('data-drill')); if(Object.keys(d).length) drill(d); }
    };
    return;
  }
  if(ovMain==='pool' && ovView==='pools'){
    ['[主]會費池','[私]Lina贊助池','[私]花零用金池'].forEach(function(p){
      h += statCard(p+' 餘額', money(bal[p]), '', false, {pool:p});
    });
  }
  if(ovMain==='act'){
    function actMatch(r,k){ return k==='(未標活動)' ? !r.act : r.act===k; }
    if(ovActSel){
      var cats={}, ti=0, to=0;
      (lastData.recent||[]).forEach(function(r){
        if(r.voided || !actMatch(r,ovActSel)) return;
        ti+=r.income; to+=r.expense;
        var c=r.cat; cats[c]=cats[c]||{i:0,o:0}; cats[c].i+=r.income; cats[c].o+=r.expense;
      });
      h += '<button class="ghost" style="width:auto;padding:7px 12px;font-size:12px;margin-bottom:8px" onclick="ovActBack()">‹ 活動列表</button>';
      h += '<b style="display:block;font-size:15px;margin-bottom:6px">🎯 '+esc(ovActSel)+'</b>';
      h += statCard('支出合計', money(to), '', true);
      if(ti>0){ h += statCard('收入合計', '+'+money(ti)); h += statCard('淨支出', money(to-ti)); }
      h += '<p class="sub" style="margin:8px 0 4px;font-size:11px">依類別(點入逐筆)</p>';
      Object.keys(cats).sort(function(a,b){ return cats[b].o-cats[a].o; }).forEach(function(c){
        var cd=cats[c];
        h += statCard(c, cd.o>0?money(cd.o):'+'+money(cd.i),
          (cd.o>0&&cd.i>0)?'另有收入 '+money(cd.i):'',
          false, ovActSel==='(未標活動)' ? {act:'(未標活動)',cat:c} : {act:ovActSel,cat:c});
      });
      h += statCard('全部逐筆明細', '›', '', false, ovActSel==='(未標活動)' ? {act:'(未標活動)'} : {act:ovActSel});
    } else {
      var g={};
      (lastData.recent||[]).forEach(function(r){
        if(r.voided) return;
        if(r.act){ g[r.act]=g[r.act]||{i:0,o:0}; g[r.act].i+=r.income; g[r.act].o+=r.expense; }
        else if(r.expense>0){ g['(未標活動)']=g['(未標活動)']||{i:0,o:0}; g['(未標活動)'].o+=r.expense; }
      });
      Object.keys(g).sort(function(a,b){
        if(a==='(未標活動)') return 1; if(b==='(未標活動)') return -1;
        return g[b].o-g[a].o;
      }).forEach(function(k){
        h += '<div class="card" data-actsel="'+esc(k)+'" style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;margin-bottom:6px;border-left:4px solid #c9ced6;cursor:pointer">'+
          '<span style="min-width:0"><span style="font-size:12.5px;color:#5a5f66">🎯 '+esc(k)+'</span>'+
          (g[k].i>0?'<br><span class="sub" style="font-size:10.5px">收入 '+money(g[k].i)+'・淨支出 '+money(g[k].o-g[k].i)+'</span>':'')+'</span>'+
          '<b style="font-size:16px;white-space:nowrap">'+money(g[k].o)+' <span style="color:#5a5f66;font-weight:400">›</span></b></div>';
      });
      if(!Object.keys(g).length) h+='<p class="sub">尚無活動標記;登帳時填「活動」欄或編輯既有帳補標</p>';
    }
  }
  if(ovMain==='pool' && ovView==='team'){
    var tp={};
    (lastData.recent||[]).forEach(function(r){
      if(r.voided || !r.expense || r.cat==='內部調撥' || r.cat==='贊助轉出') return;
      tp[r.team]=tp[r.team]||{m:0,p:0};
      if(r.pool==='[主]會費池') tp[r.team].m+=r.expense; else tp[r.team].p+=r.expense;
    });
    function tHint(k){
      var t=tp[k]||{m:0,p:0}, ps=[];
      if(t.m) ps.push('會費池 '+money(t.m));
      if(t.p) ps.push('私帳 '+money(t.p));
      return ps.join('・');
    }
    h += statCard('創主班 累計支出', money(o.teamSpend['創主班']), tHint('創主班'), false, {team:'創主班',dir:'out'});
    h += statCard('創12 累計支出', money(o.teamSpend['創12']), tHint('創12')+'(調撥已排除)', false, {team:'創12',dir:'out'});
    if(o.teamSpend['待分類']>0) h += statCard('⚠️ 待分類支出', money(o.teamSpend['待分類']), tHint('待分類')+'・請裁定歸屬', false, {team:'待分類',dir:'out'});
  }
  if(ovMain==='pool' && ovView==='lina'){
    h += statCard('麗娜會長 贊助總額', money(o.lina.sponsor), '利息另 +'+money(o.lina.interest), true, {pool:'[私]Lina贊助池',dir:'in'});
    h += statCard('→ 直付創12', money(o.lina.direct12), '', false, {pool:'[私]Lina贊助池',team:'創12',dir:'out'});
    h += statCard('→ 轉入球隊帳(正式贊助・記名致謝)', money(o.lina.toTeam||0), '同單號另見[主]會費池贊助收入', false, {pool:'[私]Lina贊助池',cat:'贊助轉出'});
    h += statCard('→ 直付創業主班(代付)', money(o.lina.directMain), '', false, {pool:'[私]Lina贊助池',team:'創主班',dir:'out'});
    h += statCard('→ 撥入花零用金', money(o.lina.toPetty),
      '零用金支出分佈:創12 '+money(o.petty.spent12)+'|創主班 '+money(o.petty.spentMain),
      false, {pool:'[私]花零用金池',dir:'out'});
    if(o.lina.privUse>0) h += statCard('→ Lina 私人用途', money(o.lina.privUse), '非隊伍支出(如:球120盒)', false, {pool:'[私]Lina贊助池',team:'Lina私用',dir:'out'});
    if(o.lina.unclassified>0) h += statCard('→ 待分類', money(o.lina.unclassified), '凌華裁定後歸隊', false, {pool:'[私]Lina贊助池',team:'待分類',dir:'out'});
    h += statCard('尚在池中(餘額)', money(o.lina.balance), '', false, {pool:'[私]Lina贊助池'});
  }
  if(ovMain==='pool' && ovView==='adv'){
    var netPos = o.petty.balance - o.petty.custody;
    h += statCard('凌華 累計墊付支出', money(o.petty.spent), '創12 '+money(o.petty.spent12)+'|創主班 '+money(o.petty.spentMain), true, {pool:'[私]花零用金池',dir:'out'});
    h += statCard('允甄 已撥補給凌華', money(o.petty.funded), 'F 單號調撥合計', false, {pool:'[私]花零用金池',cat:'內部調撥',dir:'in'});
    h += statCard('代收款在手(衣服)', money(o.petty.custody), '待轉付廠商,非凌華資金', false, {pool:'[私]花零用金池',cat:'代收款'});
    h += statCard(netPos<0 ? '⚠️ 凌華目前墊付中' : '凌華手上隊款',
      money(Math.abs(netPos)),
      netPos<0 ? '允甄下次撥補時補足' : '無代墊,持有隊款');
  }
  if(ovMain==='pool') h = '<p class="sub" style="margin-bottom:6px;font-size:11px">點卡片看逐筆明細</p>'+h;
  body.innerHTML=h;
  body.onclick = function(ev){
    var a = ev.target.closest('[data-actsel]');
    if(a){ ovActSel = a.getAttribute('data-actsel'); renderOverview(); return; }
    var c = ev.target.closest('[data-drill]');
    if(c) drill(JSON.parse(c.getAttribute('data-drill')));
  };
}

var entryTab='priv';
function setEntryTab(t){
  entryTab=t;
  var m=document.getElementById('etMain'), p=document.getElementById('etPriv');
  m.style.background = t==='main'?'#1F3864':'#fff'; m.style.color = t==='main'?'#fff':'var(--txt)';
  p.style.background = t==='priv'?'#1F3864':'#fff'; p.style.color = t==='priv'?'#fff':'var(--txt)';
  cur=null; photoData=null;
  document.getElementById('form').classList.add('hide');
  document.getElementById('chips').innerHTML='';
  document.getElementById('fields').innerHTML='';
  document.getElementById('saveBtn').classList.add('hide');
  renderTpls();
}

function renderTpls(){
  var g=document.getElementById('tpls'); g.innerHTML='';
  (TPL[user]||[]).filter(function(tp){ return tp.k===entryTab; }).forEach(function(tp){
    var b=document.createElement('button'); b.textContent=tp.t;
    b.onclick=function(){ pick(tp) }; g.appendChild(b);
  });
  var ft=FREE_TPL[entryTab];
  var fb=document.createElement('button'); fb.textContent=ft.t;
  fb.style.borderStyle='dashed';
  fb.onclick=function(){ pick(ft) }; g.appendChild(fb);
}

function pick(tp){
  cur=tp; photoData=null;
  document.getElementById('form').classList.remove('hide');
  document.getElementById('ftitle').textContent = tp.t;
  var chips='';
  chips += tp.poolSel?'' : '<span class="chip c-pool">池 '+tp.pool+'</span>';
  chips += tp.teamSel?'' : '<span class="chip c-team">隊 '+tp.team+'</span>';
  chips += tp.catSel?'' : '<span class="chip c-cat">類 '+tp.cat+'</span>';
  if(tp.ref) chips += '<span class="chip c-ref">單號 自動('+tp.ref+'12)</span>';
  if(tp.note) chips += '<span class="chip c-note">'+tp.note+'</span>';
  document.getElementById('chips').innerHTML = chips;
  var today = new Date().toISOString().slice(0,10);
  var h='<input type="date" id="fDate" value="'+today+'">';
  if(tp.poolSel) h+='<select id="fPool"><option>[主]會費池</option><option>[私]Lina贊助池</option></select>';
  if(tp.teamSel){
    var to=TEAMS.slice(); to.splice(to.indexOf(tp.team),1); to.unshift(tp.team);
    h+='<select id="fTeamE">'+to.map(function(x){return '<option>'+x+'</option>'}).join('')+'</select>';
  }
  h+='<input type="number" id="fAmt" placeholder="金額" inputmode="numeric">';
  if(tp.catSel) h+='<select id="fCat" onchange="catGuard(this,\'fTeamE\')">'+CATS.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select>';
  h+='<input type="text" id="fDesc" placeholder="明細,例:8/27長庚月例賽">';
  h+='<input type="text" id="fAct" list="actList" placeholder="活動(選填,例:9月例賽)">';
  if(tp.payer) h+='<input type="text" id="fPayer" placeholder="繳款人/贊助者姓名(必填)">';
  if(tp.refManual) h+='<input type="text" id="fRefM" placeholder="對應調撥單號,例:F12-005">';
  if(tp.free){
    var poolOpts = entryTab==='main' ? ['[主]會費池'] : ['[私]Lina贊助池','[私]花零用金池'];
    h='<input type="date" id="fDate" value="'+today+'">';
    if(poolOpts.length>1) h+='<select id="fPool">'+poolOpts.map(function(p){return '<option>'+p+'</option>'}).join('')+'</select>';
    h+='<select id="fDir"><option value="out">支出</option><option value="in">收入</option></select>';
    h+='<input type="number" id="fAmt" placeholder="金額" inputmode="numeric">';
    h+='<select id="fCat" onchange="catGuard(this,\'fTeamE\')">'+ALL_CATS.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select>';
    h+='<select id="fTeamE">'+ALL_TEAMS.map(function(x){return '<option>'+x+'</option>'}).join('')+'</select>';
    h+='<input type="text" id="fDesc" placeholder="明細">';
    h+='<input type="text" id="fAct" list="actList" placeholder="活動(選填)">';
    h+='<select id="fRef"><option value="">單號:無</option><option value="R">單號:R12 自動取號</option><option value="F">單號:F12 自動取號</option></select>';
    h+='<input type="text" id="fPayer" list="memberList" placeholder="繳款人/對象(選填)">';
    h+='<label>收據照片(選填)</label><input type="file" id="fPhoto" accept="image/*" capture="environment" onchange="readPhoto(this)">';
    document.getElementById('fields').innerHTML=h;
    document.getElementById('chips').innerHTML =
      (poolOpts.length===1?'<span class="chip c-pool">池 '+poolOpts[0]+'</span>':'<span class="chip c-pool">池 自選</span>')+
      '<span class="chip c-note">自由模式:各欄自行勾選</span>';
    document.getElementById('saveBtn').classList.remove('hide');
    return;
  }
  if(tp.pair){ h='<input type="date" id="fDate" value="'+today+'">'+
    '<input type="number" id="fAmt" placeholder="轉帳金額" inputmode="numeric">'+
    '<input type="text" id="fNote" placeholder="備註(選填)">'+
    '<p class="sub">按下儲存將同時產生:[私]Lina贊助池 贊助轉出(支出)+[主]會費池 贊助收入・記名 李麗娜(收入),同掛一個 F 單號</p>'; }
  else if(tp.dir<0) h+='<label>收據照片(選填,自動歸檔 Drive)</label><input type="file" id="fPhoto" accept="image/*" capture="environment" onchange="readPhoto(this)">';
  document.getElementById('fields').innerHTML=h;
  document.getElementById('saveBtn').classList.remove('hide');
}

function catGuard(catEl, teamId){
  var teamEl = document.getElementById(teamId);
  if(!teamEl) return;
  var lock = (catEl.value==='球秘請款' || catEl.value==='球秘執行費');
  if(lock){ teamEl.value='創主班'; teamEl.disabled=true; toast('球秘支出=創主班支出,隊伍已鎖定'); }
  else teamEl.disabled=false;
}

function readPhoto(inp){
  var f=inp.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){ photoData={ b64: rd.result.split(',')[1], mime: f.type }; toast('照片已附加'); };
  rd.readAsDataURL(f);
}

function save(){
  if(!cur) return;
  var amt = parseInt(document.getElementById('fAmt').value||'0',10);
  if(!amt){ toast('請填金額'); return; }
  if(cur.free){
    var poolEl0=document.getElementById('fPool');
    var dir=document.getElementById('fDir').value;
    var refT=document.getElementById('fRef').value;
    var payer0=document.getElementById('fPayer').value.trim();
    var desc0=document.getElementById('fDesc').value.trim()||'自由登帳';
    if(payer0) desc0+='('+payer0+')';
    var en0={
      date: document.getElementById('fDate').value.replace(/-/g,''),
      pool: poolEl0?poolEl0.value:cur.pool,
      team: document.getElementById('fTeamE').value,
      cat: document.getElementById('fCat').value,
      desc: desc0,
      act: document.getElementById('fAct').value.trim(),
      income: dir==='in'?amt:'', expense: dir==='out'?amt:'',
      refType: refT,
      status: dir==='out'?(refT?'已撥款':'已支付'):'—',
      note:''
    };
    if(photoData){ en0.photoBase64=photoData.b64; en0.photoMime=photoData.mime; }
    var btn0=document.getElementById('saveBtn'); btn0.disabled=true; btn0.textContent='儲存中…';
    api({action:'add',entry:en0}).then(function(j){
      toast('已入帳 '+j.txnId+(j.ref?'|'+j.ref:''));
      btn0.disabled=false; btn0.textContent='儲存並登入總帳';
      document.getElementById('fAmt').value=''; photoData=null;
      var fp0=document.getElementById('fPhoto'); if(fp0) fp0.value='';
      refresh();
    }).catch(function(e){ toast('失敗:'+e.message); btn0.disabled=false; btn0.textContent='儲存並登入總帳'; });
    return;
  }
  if(cur.pair){
    var nEl=document.getElementById('fNote');
    var btn0=document.getElementById('saveBtn'); btn0.disabled=true; btn0.textContent='成對入帳中…';
    api({action:'sponsorTransfer',amount:amt,
      date:document.getElementById('fDate').value.replace(/-/g,''),
      note:nEl?nEl.value.trim():''}).then(function(j){
      toast('已成對入帳 '+j.ref+'(私池支出+球隊帳贊助收入)');
      btn0.disabled=false; btn0.textContent='儲存並登入總帳';
      document.getElementById('fAmt').value='';
      refresh();
    }).catch(function(e){ toast('失敗:'+e.message); btn0.disabled=false; btn0.textContent='儲存並登入總帳'; });
    return;
  }
  var payerEl=document.getElementById('fPayer');
  if(cur.payer && payerEl && !payerEl.value.trim()){ toast('收入需填繳款人姓名'); return; }
  var catEl=document.getElementById('fCat'), poolEl=document.getElementById('fPool'), teamEl=document.getElementById('fTeamE');
  var desc=document.getElementById('fDesc').value || cur.t;
  if(payerEl && payerEl.value) desc += '('+payerEl.value.trim()+')';
  var refM=document.getElementById('fRefM');
  var actEl=document.getElementById('fAct');
  var en={
    act: actEl?actEl.value.trim():'',
    date: document.getElementById('fDate').value.replace(/-/g,''),
    pool: poolEl?poolEl.value:cur.pool,
    team: teamEl?teamEl.value:cur.team,
    cat: catEl?catEl.value:cur.cat,
    desc: desc,
    income: cur.dir>0?amt:'',
    expense: cur.dir<0?amt:'',
    refType: cur.ref||'',
    status: cur.dir<0?(cur.ref?'已撥款':'已支付'):'—',
    note: refM&&refM.value?('對應 '+refM.value):''
  };
  if(photoData){ en.photoBase64=photoData.b64; en.photoMime=photoData.mime; }
  var btn=document.getElementById('saveBtn'); btn.disabled=true; btn.textContent='儲存中…';
  api({action:'add',entry:en}).then(function(j){
    toast('已入帳 '+j.txnId+(j.ref?'|'+j.ref:''));
    btn.disabled=false; btn.textContent='儲存並登入總帳';
    document.getElementById('fAmt').value=''; photoData=null;
    var fp=document.getElementById('fPhoto'); if(fp) fp.value='';
    refresh();
  }).catch(function(e){ toast('失敗:'+e.message); btn.disabled=false; btn.textContent='儲存並登入總帳'; });
}

function refresh(){
  api({action:'summary'}).then(function(j){
    lastData=j;
    pendCount = (j.reqs||[]).filter(function(r){
      return (user==='允甄'&&r.status==='待匯款')||(user==='凌華'&&r.status==='已匯款');
    }).length;
    navBadge();
    var acts={};
    (j.recent||[]).forEach(function(r){ if(!r.voided&&r.act) acts[r.act]=1; });
    document.getElementById('actList').innerHTML =
      Object.keys(acts).sort().map(function(a){return '<option value="'+esc(a)+'">'}).join('');
    if(curTab==='home') renderHome();
    if(curTab==='det') renderDetail();
    if(curTab==='recon') renderRecon();
    if(!document.getElementById('ovSec').classList.contains('hide')) renderOverview();
    if(!document.getElementById('paySec').classList.contains('hide')) renderReqs();
    handleDeepLink();
    ['[主]會費池','[私]Lina贊助池','[私]花零用金池'].forEach(function(p,i){
      document.getElementById('b'+i).textContent = money(j.balances[p]);
      var rc=(j.recon||{})[p], badge=document.getElementById('rb'+i);
      if(badge) badge.textContent = rc ? ('✓對帳至'+String(rc.date).slice(4,6)+'/'+String(rc.date).slice(6,8)) : '';
    });
    var lg=document.getElementById('log'); lg.innerHTML='';
    j.recent.slice(0,3).forEach(function(r){
      var d=document.createElement('div');
      d.className='item'+(r.voided?' voided':'');
      d.innerHTML='<div class="top"><span>'+esc(r.desc)+'</span>'+
        '<span class="'+(r.income?'amt-in':'amt-out')+'">'+(r.income?'+'+money(r.income):'−'+money(r.expense))+'</span></div>'+
        '<div class="chips"><span class="chip c-pool">'+r.pool+'</span><span class="chip c-team">'+r.team+'</span>'+
        '<span class="chip c-cat">'+r.cat+'</span>'+(r.ref?'<span class="chip c-ref">'+r.ref+'</span>':'')+
        '<span class="sub" style="margin-left:auto">'+r.date+'</span></div>';
      lg.appendChild(d);
    });
  }).catch(function(e){ toast('讀取失敗:'+e.message); });
}

function switchRole(r){
  user = r; cur = null; photoData = null;
  var fm0=document.getElementById('form'); if(fm0) fm0.classList.add('hide');
  document.getElementById('chips').innerHTML = '';
  document.getElementById('fields').innerHTML = '';
  document.getElementById('saveBtn').classList.add('hide');
  var rf = document.getElementById('reqForm'); if(rf) rf.classList.add('hide');
  enter();
  var sel = document.getElementById('roleSwitch'); if(sel) sel.value = r;
}
user='麗娜'; enter();
