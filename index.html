<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>高球隊財務|登帳</title>

<link rel="icon" type="image/png" href="golf-icon.png">

<style>
:root{--navy:#1F3864;--bg:#F5F6F8;--card:#fff;--line:#E3E6EB;--txt:#1c1c1e;--sub:#6b7280;
--blue:#E6F1FB;--blueT:#0C447C;--green:#EAF3DE;--greenT:#27500A;--amber:#FAEEDA;--amberT:#633806;
--purple:#EEEDFE;--purpleT:#3C3489;--red:#FCEBEB;--redT:#791F1F;}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--txt);padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 14px calc(14px + env(safe-area-inset-left));max-width:480px;margin:0 auto}
h1{font-size:17px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--blue);color:var(--blueT);display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.sub{font-size:12px;color:var(--sub)}
.bal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.bal div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.bal p{font-size:11px;color:var(--sub)}
.bal b{font-size:15px;font-weight:600}
.tpls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.tpls button{padding:12px 10px;font-size:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt)}
.tpls button:active{background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:11px;padding:3px 9px;border-radius:999px}
.c-pool{background:var(--blue);color:var(--blueT)}
.c-team{background:var(--green);color:var(--greenT)}
.c-cat{background:var(--amber);color:var(--amberT)}
.c-ref{background:var(--purple);color:var(--purpleT)}
.c-note{background:var(--red);color:var(--redT)}
input,select,button.btn{width:100%;padding:11px;font-size:15px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px}
button.btn{background:var(--navy);color:#fff;border:none;font-weight:600}
button.btn:disabled{opacity:.5}
button.ghost{background:#fff;color:var(--txt);border:1px solid var(--line)}
.log .item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:6px}
.log .top{display:flex;justify-content:space-between;font-size:13px}
.amt-in{color:#27500A;font-weight:600}.amt-out{font-weight:600}
.voided{opacity:.45;text-decoration:line-through}
.toast{position:sticky;top:8px;z-index:9;background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;display:none;margin-bottom:10px}
#loginView{margin-top:18vh;text-align:center}
#loginView .card{text-align:left}
.hide{display:none}
label{font-size:12px;color:var(--sub)}
.nav{position:fixed;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 0 max(10px,env(safe-area-inset-bottom));z-index:50}
.nav button{flex:1;border:none;background:none;text-align:center;padding:4px 0;position:relative;margin:0;border-radius:0}
.nav .ic{font-size:21px;display:block;line-height:1.2}
.nav .lb{font-size:10.5px;color:var(--sub)}
.nav .on .lb{color:#1F3864;font-weight:600}
.nav .bdg{position:absolute;top:-2px;right:22%;background:#C0392B;color:#fff;font-size:10px;border-radius:999px;padding:1px 6px;font-weight:600}
.sheetBk{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60}
.sheet{position:fixed;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:480px;background:#fff;border-radius:16px 16px 0 0;padding:14px 14px max(16px,env(safe-area-inset-bottom));z-index:61}
.sheet button{width:100%;text-align:left;padding:13px 12px;margin:0 0 6px;font-size:14px;border:1px solid var(--line);border-radius:10px;background:#fff}
body.appOn{padding-bottom:92px}
</style>
</head>
<body>
<input type="file" id="reqUpFile" accept="image/*" multiple class="hide" onchange="reqUpGo(this)">
<div id="lightbox" onclick="closeLb()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99;align-items:center;justify-content:center;flex-direction:column">
  <img id="lbImg" style="max-width:94vw;max-height:78vh;border-radius:10px;background:#fff" alt="憑證">
  <p style="color:#fff;font-size:13px;margin-top:12px;opacity:.85">點任意處關閉</p>
  <a id="lbLink" href="#" target="_blank" onclick="event.stopPropagation()" style="color:#9ec5ff;font-size:12.5px;margin-top:4px">在 Drive 開啟原檔 ›</a>
</div>
<div id="vchOverlay" style="display:none;position:fixed;inset:0;background:#fff;z-index:80;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 90px">

    <button class="ghost" style="flex:1;margin:0" onclick="closeVchOverlay()">✕ 關閉</button>
    <button class="btn" style="flex:2;margin:0" onclick="printVchDoc()">🖨 列印 / 存 PDF</button>
  </div>
  <div id="vchDoc"></div>
</div>
<div id="navBar" class="nav hide"></div>
<div id="moreWrap" class="hide">
  <div class="sheetBk" onclick="toggleMore(false)"></div>
  <div class="sheet">
    <p class="sub" style="margin-bottom:8px">更多功能</p>
    <div id="moreItems"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<div id="loginView">
  <h1 style="margin-bottom:6px">⛳ 高球隊財務系統</h1>
  <p class="sub" style="margin-bottom:16px">第12屆|輕量版 L1</p>
  <div class="card">
    <label>登入代碼(向凌華索取)</label>
    <input id="tokenInput" type="password" placeholder="輸入代碼" autocomplete="off">
    <button class="btn" onclick="login()">登入</button>
  </div>
</div>

<div id="mainView" class="hide">
  <div class="card">
    <div class="row">
      <div class="avatar" id="avatar">?</div>
      <div style="flex:1"><b id="uname"></b><p class="sub" id="urole"></p></div>
      <button class="ghost" style="width:auto;padding:8px 12px;margin:0" onclick="refresh()">↻</button>
      <button class="ghost" style="width:auto;padding:8px 12px;margin:0" onclick="logout()">登出</button>
    </div>
  </div>

  <div id="pageHead" class="hide" style="margin-bottom:12px">
    <div style="display:flex;align-items:center;gap:10px">
      <button id="backBtn" class="ghost" style="width:auto;padding:8px 14px;margin:0" onclick="showTab('home')">‹ 首頁</button>
      <b id="pageTitle" style="font-size:15px"></b>
    </div>
  </div>

  <div id="homeSec">
  <div class="bal">
    <div style="background:#EFF6FD;border-color:#0C447C;border-left-width:4px"><p style="color:#0C447C">[主]會費池</p><b id="b0" style="color:#0C447C">—</b><p class="sub" style="font-size:10px;color:#27500A" id="rb0"></p></div>
    <div style="background:#F4F3FE;border-color:#3C3489;border-left-width:4px"><p style="color:#3C3489">[私]Lina贊助池</p><b id="b1" style="color:#3C3489">—</b><p class="sub" style="font-size:10px;color:#27500A" id="rb1"></p></div>
    <div style="background:#FDEFF4;border-color:#B03A73;border-left-width:4px"><p style="color:#B03A73">[私]花零用金池</p><b id="b2" style="color:#B03A73">—</b><p class="sub" style="font-size:10px;color:#27500A" id="rb2"></p></div>
  </div>

    <div class="tpls" style="grid-template-columns:repeat(2,1fr)" id="homeTiles"></div>
    <div class="card" style="padding:10px 6px">
      <p class="sub" style="padding:0 6px 6px">金流總覽(可點入明細)</p>
      <div id="homeFlow"></div>
    </div>
    <p class="sub" style="text-align:center;font-size:10px;margin-top:2px">GOLF-FIN L3 build 2026-08-10a</p>
  </div>

  <div id="memberSec" class="hide">
    <div class="card" style="padding:10px">
      <input type="text" id="mKw" placeholder="🔍 後5碼 / 姓名 / 電話" oninput="renderMembers()" style="margin:0 0 6px">
      <div style="display:flex;gap:6px">
        <select id="mCohort" onchange="renderMembers()" style="flex:1;margin:0"><option value="">全部屆別</option></select>
        <button class="ghost" style="width:auto;padding:8px 12px;margin:0;font-size:12px" onclick="memberSync()">🔄 同步報名資料</button>
      </div>
    </div>
    <div class="card" style="padding:8px 10px" id="mSum"></div>
    <div id="mList"></div>
  </div>
  <datalist id="memberList"></datalist>
  <datalist id="actList"></datalist>

  <div id="vchSec" class="hide">
    <div class="card" style="padding:8px 12px" id="vchSum"></div>
    <div id="vchList"></div>
  </div>

  <div id="pubSec" class="hide">
    <div id="pubBody"></div>
  </div>

  <div id="reconSec" class="hide">
    <div id="reconBody"></div>
  </div>

  <div id="detSec" class="hide">
    <div class="card" style="padding:10px" id="detCtrl">
      <div style="display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px">
        <button id="dtMain" onclick="setDetTab('main')" style="flex:1;padding:9px 4px;margin:0;border:none;border-radius:0;font-size:13px">🔵 會費帳</button>
        <button id="dtPriv" onclick="setDetTab('priv')" style="flex:1;padding:9px 4px;margin:0;border:none;border-radius:0;border-left:1px solid var(--line);font-size:13px">🟣 私帳</button>
      </div>
      <div id="privSubRow" style="display:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px">
        <button onclick="setPrivSub('')" style="flex:1;padding:7px 4px;margin:0;border:none;border-radius:0;font-size:12px">全部私帳</button>
        <button onclick="setPrivSub('[私]Lina贊助池')" style="flex:1;padding:7px 4px;margin:0;border:none;border-radius:0;border-left:1px solid var(--line);font-size:12px">🟣 Lina池</button>
        <button onclick="setPrivSub('[私]花零用金池')" style="flex:1;padding:7px 4px;margin:0;border:none;border-radius:0;border-left:1px solid var(--line);font-size:12px">🌸 零用金</button>
        <button onclick="setPrivSub('[外]會長直付')" style="flex:1;padding:7px 4px;margin:0;border:none;border-radius:0;border-left:1px solid var(--line);font-size:12px">🎁 會長直付</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <select id="dYear" onchange="renderDetail()" style="font-size:13px;padding:9px 6px;margin:0"><option value="">全部年度</option></select>
        <select id="dTeam" onchange="renderDetail()" style="font-size:13px;padding:9px 6px;margin:0"><option value="">隊伍</option><option>創主班</option><option>創12</option><option>共用</option><option>Lina私用</option><option>待分類</option></select>
        <select id="dCat" onchange="renderDetail()" style="font-size:13px;padding:9px 6px;margin:0"><option value="">類別</option></select>
        <select id="dDir" onchange="renderDetail()" style="font-size:13px;padding:9px 6px;margin:0"><option value="">收支</option><option value="in">收入</option><option value="out">支出</option></select>
      </div>
      <input type="text" id="dKw" placeholder="🔍 搜尋明細/單號…" oninput="renderDetail()" style="margin:6px 0 0;font-size:13px;padding:9px">
    </div>
    <p id="detFilterLink" style="display:none;margin:0 0 8px"><a href="javascript:void(0)" onclick="document.getElementById('detCtrl').style.display='block';this.parentNode.style.display='none'" style="font-size:12.5px;color:#1F3864">⚙ 顯示篩選條件(目前依報表鑽取自動設定)</a></p>
    <div id="dList"></div>
  </div>

  <div id="paySec" class="hide">
    <button class="btn ghost" id="reqNewBtn" onclick="toggleReqForm()" style="border-style:dashed">＋ 新增付款請求(談好廠商後填這裡)</button>

      <b style="font-size:14px">新付款請求</b>
      <div style="margin-top:8px">
        <div style="display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px">
          <button type="button" id="rtGen" onclick="setReqType('gen')" style="flex:1;padding:9px 4px;margin:0;border:none;border-radius:0;font-size:13px;background:#1F3864;color:#fff">一般請款</button>
          <button type="button" id="rtSec" onclick="setReqType('sec')" style="flex:1;padding:9px 4px;margin:0;border:none;border-radius:0;border-left:1px solid var(--line);font-size:13px;background:#fff">🏌️ 球秘請款(含明細)</button>
        </div>
        <label>常用廠商(選擇自動帶入帳戶;新廠商選手動輸入,儲存後自動入冊)</label>

        <label>支出資金池 — 允甄將由此戶頭匯出</label>
        <select id="rPool"><option>[主]會費池</option><option>[私]Lina贊助池</option></select>
        <input type="text" id="rDesc" placeholder="項目說明,例:8月獎品採購 保溫瓶×10">
        <input type="text" id="rAct" list="actList" placeholder="活動(例:8月例賽;球秘請款必填)">
        <div id="rItems" class="hide" style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px">
          <p class="sub" style="margin-bottom:6px">請款明細(逐項填入,總額自動加總)</p>
          <div id="rItemRows"></div>
          <datalist id="secItemList"></datalist>
          <button type="button" class="ghost" onclick="addItemRow()" style="border-style:dashed;padding:8px;font-size:13px">＋ 加一項</button>
          <div style="display:flex;justify-content:space-between;font-size:14px;margin-top:6px"><b>合計</b><b id="rItemTotal">0</b></div>
        </div>
        <input type="number" id="rAmt" placeholder="金額" inputmode="numeric">
        <select id="rTeam"><option>創主班</option><option>創12</option><option>共用</option><option>Lina私用</option></select>
        <select id="rCat" onchange="catGuard(this,'rTeam')"></select>
        <div id="bankFields">
        <input type="text" id="rPayee" placeholder="收款戶名(廠商)">
        <input type="text" id="rBank" placeholder="銀行代碼,例:012-7288">
        <input type="text" id="rBranch" placeholder="銀行分行(中文),例:南京東路分行">
        <input type="text" id="rAcct" placeholder="銀行帳號">
        </div>
        <div id="secBankInfo" class="hide" style="background:#F7F8FA;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:13px"></div>
        <input type="text" id="rNote" placeholder="備註(選填)">
        <label>📎 憑證照片(選填,可多張,自動歸檔 Drive)</label>
        <input type="file" id="rPhotos" accept="image/*" multiple onchange="readReqPhotos(this)">
        <button class="btn" onclick="reqCreate()">送出給允甄匯款</button>
      </div>
    </div>
    <div id="reqList"></div>
  </div>

  <div id="ovSec" class="hide">
    <div class="card" style="padding:10px" id="ovPillRow">
      <div id="ovPills" style="display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff"></div>
      <div id="ovSub" style="display:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px;background:#fff"></div>
    </div>
    <button class="ghost" style="margin:8px 0;padding:9px;font-size:13px" onclick="printReport()">🖨 匯出 PDF(表格版,可預覽/儲存/傳送)</button>
    <div id="ovBody"></div>
  </div>

  <div id="entrySec">
    <div class="card" style="padding:10px;margin-bottom:8px">
      <div style="display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff">
        <button id="etMain" onclick="setEntryTab('main')" style="flex:1;padding:9px 4px;margin:0;border:none;border-radius:0;font-size:13px">🔵 會費帳</button>
        <button id="etPriv" onclick="setEntryTab('priv')" style="flex:1;padding:9px 4px;margin:0;border:none;border-radius:0;border-left:1px solid var(--line);font-size:13px">🟣 私帳</button>
      </div>
    </div>
    <p class="sub" style="margin-bottom:6px">選擇範本,掛勾自動完成;範本不合用時選 ⚡自由登帳</p>
    <div class="tpls" id="tpls"></div>

    <div class="card hide" id="form">
      <b id="ftitle" style="font-size:14px"></b>
      <div class="chips" id="chips"></div>
      <div id="fields"></div>
      <button class="btn hide" id="saveBtn" onclick="save()">儲存並登入總帳</button>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px">
      <p class="sub" id="logTitle">最近入帳</p>
      <button class="ghost" style="width:auto;padding:6px 12px;margin:0;font-size:12px" onclick="showTab('det')">查看全部明細 ›</button>
    </div>
    <div class="log" id="log"></div>
  </div>
</div>

<script>

function cnUpper(n){
  var d='零壹貳參肆伍陸柒捌玖', u=['','拾','佰','仟'], g=['','萬','億'];
  n=Math.round(Number(n)); if(!n) return '零元整';
  var s='', gi=0, prevSeg=null;
  while(n>0){
    var seg=n%10000, seg0=seg, ss='';
    if(seg){
      var z=false;
      for(var i=0;i<4 && seg>0;i++){
        var dg=seg%10;
        if(dg){ ss=d[dg]+u[i]+ss; z=false; }
        else if(ss && !z){ ss='零'+ss; z=true; }
        seg=Math.floor(seg/10);
      }
      s = ss+g[gi] + (s && prevSeg!==null && prevSeg<1000 ? '零' : '') + s;
    }
    prevSeg=seg0;
    n=Math.floor(n/10000); gi++;
  }
  return s.replace(/零+/g,'零').replace(/^零|零$/g,'')+'元整';
}

function saveEdit(txn){
  var r=(lastData.recent||[]).find(function(x){return x.id===txn});

           team:document.getElementById('eTeam').value,

           fy: fyVal===''?'':Number(fyVal),
           act: document.getElementById('eAct').value.trim() };
  var fyCur=r.fy||'';

function publishMonth(ym){
  var rc=(lastData.recon||{})['[主]會費池'];
  var warn = (!rc || Number(rc.date) < Number(ym.replace('-',''))*100+28)
    ? '\n⚠️ 該月尚未完成銀行對帳勾稽,建議先勾稽再發布(仍可發布)。' : '';
  var sp=[];
  (lastData.recent||[]).forEach(function(r){
    if(r.voided||r.pool!=='[主]會費池'||r.cat!=='贊助收入') return;
    if(String(r.date).slice(0,6)!==ym.replace('-','')) return;
    if(String(r.desc).indexOf('暫不公開')>=0) return;
    sp.push(r.desc);
  });
  var spWarn = sp.length ? '\n🙏 芳名錄將公開(本名・須已逐位確認):\n・'+sp.join('\n・')+
    '\n(未經本人同意者請先在該筆明細加註「暫不公開」)' : '';
  if(!confirm('發布 '+ym.replace('-','年')+'月 月報至公開網頁?'+warn+spWarn)) return;
  api({action:'publishMonth',ym:ym}).then(function(j){
    var link=REPORT_URL+'?ym='+ym;
    var ym6=ym.replace('-','');
    var tin=0,tout=0,incCat={},actSum={};
    (lastData.recent||[]).forEach(function(r){
      if(r.voided||r.pool!=='[主]會費池') return;
      if(String(r.date).slice(0,6)!==ym6) return;
      tin+=r.income; tout+=r.expense;
      if(r.income>0) incCat[r.cat]=(incCat[r.cat]||0)+r.income;
      if(r.expense>0){ var k=r.act||'一般支出'; actSum[k]=(actSum[k]||0)+r.expense; }
    });
    var opening=j.closing-tin+tout;
    var msg='⛳ 政大EMBA創業主班 高爾夫球聯誼會\n'+
      '第12屆 '+ym.replace('-','年')+'月財務月報\n'+
      '──────────\n'+
      '期初結餘 '+money(opening)+'\n'+
      '本月收入 +'+money(tin)+'\n'+
      '本月支出 −'+money(tout)+'\n'+
      '期末結餘 '+money(j.closing)+'\n';
    var incKeys=Object.keys(incCat);
    if(incKeys.length){
      msg+='──────────\n收入:\n';
      incKeys.forEach(function(c){ msg+='・'+c+' '+money(incCat[c])+'\n'; });
    }
    var actKeys=Object.keys(actSum).sort(function(a,b){return actSum[b]-actSum[a]});
    if(actKeys.length){
      msg+='──────────\n支出:\n';
      actKeys.slice(0,5).forEach(function(k){ msg+='・'+k+' '+money(actSum[k])+'\n'; });
      if(actKeys.length>5){
        var rest=0; actKeys.slice(5).forEach(function(k){rest+=actSum[k]});
        msg+='・其他 '+money(rest)+'\n';
      }
    }
    msg+='──────────\n'+
      (j.reconOk?'✓ 財務已完成銀行對帳\n':'')+
      '完整明細與繳費確認:\n'+link;
    lastPubMsg={ym:ym,msg:msg,link:link};
    toast('✓ '+ym.replace('-','年')+'月已發布');
    if(navigator.clipboard){ try{ navigator.clipboard.writeText(msg); }catch(e){} }
    refresh();
  }).catch(function(e){ toast('失敗:'+e.message); });
}

var RECON_MINE={'允甄':['[主]會費池','[私]Lina贊助池'],'凌華':['[私]花零用金池'],'麗娜':[]};
var RECON_TEAM_DEFAULT={'[主]會費池':'創主班','[私]Lina贊助池':'共用','[私]花零用金池':'創12'};
var reconInput={};

function asofBal(pool, ymd){
  var s=0;
  (lastData.recent||[]).forEach(function(r){
    if(!r.voided && r.pool===pool && Number(r.date)<=ymd) s+=r.income-r.expense;
  });
  return s;
}

function renderRecon(){
  var el=document.getElementById('reconBody');
  if(!lastData){ el.innerHTML='<p class="sub">載入中…</p>'; return; }
  var mine=RECON_MINE[user]||[];
  if(!mine.length){ el.innerHTML='<p class="sub">您沒有需勾稽的資金池</p>'; return; }
  var today=tpDate();
  var h='<p class="sub" style="margin-bottom:8px">'+
    (user==='允甄'?'只有你看得到銀行明細——填入銀行實際餘額,差異=0 才能蓋勾稽章':'零用金實點金額填入,差異=0 即可勾稽')+'</p>';
  mine.forEach(function(p,idx){
    var st=reconInput[p]||{date:today,actual:''};
    reconInput[p]=st; if(!st.date) st.date=today;
    var last=(lastData.recon||{})[p];
    h+='<div class="card">';

    h+=last?'<p class="sub">上次勾稽:'+last.date+'・餘額 '+money(last.actual)+'・'+last.by+'</p>'
           :'<p class="sub">尚未勾稽過</p>';

    h+='<div style="display:flex;justify-content:space-between;font-size:13px;margin:4px 0"><span class="sub">截至該日帳面餘額</span><b id="rcAsof_'+idx+'">—</b></div>';
    h+='<label>'+(user==='允甄'?'銀行實際餘額':'實點現金餘額')+'</label>'+
       '<input type="number" inputmode="numeric" placeholder="輸入實際餘額" value="'+st.actual+'" oninput="reconSet(\''+p+'\',\'actual\',this.value,'+idx+')">';
    h+='<div id="rcDiff_'+idx+'"></div>';
    h+='</div>';
  });
  el.innerHTML=h;
  mine.forEach(function(p,idx){ reconCalc(p,idx); });
}

function reconCalc(p,idx){
  var st=reconInput[p], today=tpDate();
  var ymd=Number((st.date||today).replace(/-/g,''));
  var asof=asofBal(p,ymd);
  var az=document.getElementById('rcAsof_'+idx);
  if(az) az.textContent=money(asof);
  var actual=st.actual===''?null:Number(st.actual);
  var diff=actual===null?null:actual-asof;
  var dz=document.getElementById('rcDiff_'+idx);
  if(!dz) return;
  var h='';
  if(diff===null) h='<p class="sub">填入實際餘額後顯示差異</p>';
  else if(diff===0){
    h='<p style="font-size:14px;font-weight:600;color:#27500A;margin:4px 0">✓ 差異 0,可勾稽</p>';
    h+='<button class="btn" onclick="reconCommit(\''+p+'\')">✓ 完成勾稽(蓋檢查點,該日前帳目鎖定)</button>';
  } else {
    h='<p style="font-size:14px;font-weight:600;color:#A32D2D;margin:4px 0">差異 '+(diff>0?'+':'')+money(diff)+' 元</p>';
    if(diff>0) h+='<button class="ghost" style="margin-bottom:6px" onclick="reconQuickFix(\''+p+'\','+diff+',1)">一鍵補記:利息收入 +'+money(diff)+'</button>';
    else h+='<button class="ghost" style="margin-bottom:6px" onclick="reconQuickFix(\''+p+'\','+(-diff)+',0)">一鍵補記:手續費 −'+money(-diff)+'</button>';
    h+='<p class="sub">其他可能:有一筆尚未入帳、或金額打錯——到明細頁核對該池近期紀錄</p>';
  }
  dz.innerHTML=h;
}

function reconSet(pool,k,v,idx){
  reconInput[pool]=reconInput[pool]||{};
  reconInput[pool][k]=v;
  reconCalc(pool,idx);
}

function reconQuickFix(pool,amt,isIncome){
  var kind=isIncome?'利息收入':'銀行手續費';
  if(!confirm('補記一筆:'+pool+' '+kind+' NT$ '+money(amt)+'(今日)?')) return;
  api({action:'add',entry:{
    date:tpDate().replace(/-/g,''),
    pool:pool, team:RECON_TEAM_DEFAULT[pool],
    cat:isIncome?'利息':'手續費',
    desc:kind+'(對帳補記)',
    income:isIncome?amt:'', expense:isIncome?'':amt,
    refType:'', status:isIncome?'—':'已支付', note:'對帳勾稽時補記'
  }}).then(function(){ toast('已補記,差異應歸零'); refresh(); })
    .catch(function(e){ toast('失敗:'+e.message); });
}

function reconCommit(pool){
  var st=reconInput[pool]||{};
  var ymd=Number((st.date||tpDate()).replace(/-/g,''));
  api({action:'reconCommit',pool:pool,actual:Number(st.actual),stmtDate:ymd}).then(function(j){
    toast('✓ 勾稽完成 '+j.batch+',已鎖定 '+j.stamped+' 筆');
    reconInput[pool]={}; refresh();
  }).catch(function(e){ toast('失敗:'+e.message); });
}

var reqPhotoQ=[], reqUpRef=null;

function driveId(u){
  var m = String(u).match(/\/d\/([\w-]{20,})/) || String(u).match(/[?&]id=([\w-]{20,})/);
  return m ? m[1] : null;
}

function viewReceipt(u){
  var id = driveId(u);
  if(!id){ window.open(u, '_blank'); return; }
  document.getElementById('lbImg').src = 'https://drive.google.com/thumbnail?id='+id+'&sz=w1800';

function closeLb(){ document.getElementById('lightbox').style.display='none'; }
function reqUpStart(ref){ reqUpRef=ref; document.getElementById('reqUpFile').click(); }
function reqUpGo(inp){
  var files=Array.prototype.slice.call(inp.files||[]);
  if(!files.length||!reqUpRef) return;
  var queue=[], loaded=0;
  files.forEach(function(fl){
    var rd=new FileReader();
    rd.onload=function(){
      queue.push({b64:rd.result.split(',')[1], mime:fl.type});
      loaded++;
      if(loaded===files.length){ uploadReqPhotos(reqUpRef, queue, refresh); inp.value=''; reqUpRef=null; }
    };
    rd.readAsDataURL(fl);
  });
  toast('上傳中…');
}
function readReqPhotos(inp){
  reqPhotoQ=[];
  var files=Array.prototype.slice.call(inp.files||[]);
  files.forEach(function(fl){
    var rd=new FileReader();
    rd.onload=function(){ reqPhotoQ.push({b64:rd.result.split(',')[1], mime:fl.type}); };
    rd.readAsDataURL(fl);
  });
  if(files.length) toast('已附加 '+files.length+' 張憑證,送出後自動上傳');
}

function uploadReqPhotos(ref, queue, done){
  if(!queue.length){ if(done) done(); return; }
  var q=queue.slice(), total=q.length, n=0;
  function next(){
    if(!q.length){ toast('📎 '+total+' 張憑證已歸檔'); if(done) done(); return; }
    var ph=q.shift(); n++;
    api({action:'reqReceipt', ref:ref, b64:ph.b64, mime:ph.mime})
      .then(next).catch(function(e){ toast('憑證上傳失敗:'+e.message); next(); });
  }
  next();
}

function gatherItems(){
  var items=[];
  document.querySelectorAll('#rItemRows > div').forEach(function(row){
    var n=row.children[0].value.trim(), a=Number(row.children[1].value)||0;
    if(n && a>0) items.push({n:n, amt:a});
  });
  return items;
}

  var q={ desc:document.getElementById('rDesc').value.trim(),
    amount:parseInt(document.getElementById('rAmt').value||'0',10),
    pool:document.getElementById('rPool').value, team:document.getElementById('rTeam').value,
    cat:document.getElementById('rCat').value, payee:document.getElementById('rPayee').value.trim(),
    bankCode:document.getElementById('rBank').value.trim(), branch:document.getElementById('rBranch').value.trim(),
    bankAcct:document.getElementById('rAcct').value.trim(),
    act:document.getElementById('rAct').value.trim(),
    note:document.getElementById('rNote').value.trim() };
  if(reqType==='sec'){
    q.pool='[主]會費池';

    if(!q.act){ toast('球秘請款請填活動(例:8月例賽)'); return; }
    q.desc='球秘請款('+q.act+')';
    var hasExec = q.items.some(function(it){ return it.n.indexOf('執行費')>=0; });
    if(hasExec){
      var thisM = tpDate().slice(0,7).replace('-','');
      var dup = ((lastData&&lastData.reqs)||[]).some(function(r){
        return String(r.date||'').replace(/[^0-9]/g,'').slice(0,6)===thisM &&
          (r.items||[]).some(function(it){ return it.n.indexOf('執行費')>=0; });
      });
      if(dup && !confirm('⚠️ 本月已有一筆含「球秘執行費」的請款單(執行費一月一筆)。仍要送出?')) return;
    }
  }
  if(!q.desc||!q.amount||!q.payee){ toast('項目、金額、收款戶名必填'); return; }
  api({action:'reqCreate',req:q}).then(function(j){
    toast('已建立 '+j.ref+',允甄開啟付款頁即可匯款');

  }).catch(function(e){ toast('失敗:'+e.message); });
}

var deepLink = (function(){
  var sp = new URLSearchParams(location.search);
  var d = { ref: sp.get('ref'), act: sp.get('act') };
  if (d.ref) history.replaceState(null,'',location.pathname);
  return d.ref ? d : null;
})();

function handleDeepLink(){
  if(!deepLink || !lastData) return;
  var dl = deepLink; deepLink = null;
  showTab('pay');
  var r = (lastData.reqs||[]).find(function(x){ return x.ref===dl.ref; });
  setTimeout(function(){
    var el = document.getElementById('req-'+dl.ref);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'});
      el.style.boxShadow='0 0 0 3px #F0C36D'; setTimeout(function(){el.style.boxShadow='';},2500); }
    if(!r) return;
    if(dl.act==='pay'){
      if(user!=='允甄'){ toast('確認匯款為財務(允甄)專屬'); return; }
      if(r.status!=='待匯款'){ toast(dl.ref+' 已處理過'); return; }
      if(confirm('確認已由「'+r.pool+'」匯出 NT$ '+money(r.amount)+' 給「'+r.payee+'」?\n按下後自動入帳。')) reqPay(dl.ref);
    }
    if(dl.act==='close'){
      if(user!=='凌華'){ toast('結案為凌華專屬'); return; }
      if(r.status!=='已匯款'){ toast(dl.ref+' 狀態非已匯款'); return; }
      if(confirm('確認已通知廠商,將 '+dl.ref+' 結案?')) reqClose(dl.ref);
    }
  }, 350);
}

function renderReqs(){
  var el=document.getElementById('reqList'); el.innerHTML='';
  if(!lastData||!lastData.reqs){ el.innerHTML='<p class="sub">載入中…</p>'; return; }
  var btn=document.getElementById('reqNewBtn');
  btn.classList.toggle('hide', user==='麗娜');
  if(user==='允甄'){
    btn.textContent='＋ 代建付款請求(替總幹事/球秘建單)';
    btn.parentNode.appendChild(btn);
  } else {
    btn.textContent='＋ 新增付款請求(談好廠商後填這裡)';
    btn.parentNode.insertBefore(btn, btn.parentNode.firstChild);
  }

  function head(txt, active, color){
    el.insertAdjacentHTML('beforeend',
      '<p style="font-size:13px;font-weight:600;margin:6px 0 6px;color:'+(color||(active?'#1F3864':'#6b7280'))+'">'+txt+'</p>');
  }

  function buildCard(r){
    var d=document.createElement('div'); d.className='card';
    var closed = r.status==='已結案';
    if(closed) d.style.opacity='.75';
    var h='<div class="top" style="display:flex;justify-content:space-between;font-size:14px"><b>'+esc(r.desc)+'</b><b>'+money(r.amount)+'</b></div>';
    h+='<div class="chips"><span class="chip c-ref">'+r.ref+'</span><span class="chip c-team">'+r.team+'</span>'+statusChip(r.status)+'</div>';
    if(r.status==='待匯款'){
      var pc = r.pool.indexOf('[主]')===0 ? ['#E6F1FB','#0C447C'] : ['#EEEDFE','#3C3489'];
      h+='<p style="font-size:13px;font-weight:600;background:'+pc[0]+';color:'+pc[1]+';border-radius:8px;padding:6px 10px;margin:4px 0">🏦 由 '+r.pool+' 戶頭匯出</p>';
    } else if(!closed){
      h+='<p class="sub" style="margin:2px 0">'+r.pool+'</p>';
    }
    if(r.payee && !closed) h+='<p class="sub" style="font-family:monospace">'+esc(r.payee)+(r.bankCode?'|'+esc(r.bankCode):'')+(r.bankAcct?'|'+esc(r.bankAcct):'')+(r.branch?'|'+esc(r.branch):'')+'</p>';
    if(r.act) h+='<p class="sub">🎯 '+esc(r.act)+'</p>';
    if(r.items && r.items.length && !closed){
      h+='<div style="background:#F7F8FA;border-radius:8px;padding:7px 10px;margin:4px 0;font-size:12.5px">'+
        r.items.map(function(it){ return '<div style="display:flex;justify-content:space-between"><span>'+esc(it.n)+'</span><span>'+money(it.amt)+'</span></div>'; }).join('')+
        '</div>';
    }
    if(r.payDate) h+='<p class="sub">匯款日 '+r.payDate+'</p>';
    var rc=(r.receipts||[]).length;
    if(rc){
      h+='<p class="sub">📎 憑證 '+rc+' 張:'+
        r.receipts.map(function(u,i){ return '<a href="javascript:void(0)" onclick="viewReceipt(\''+esc(u)+'\')" style="color:#1F3864;text-decoration:underline">查看'+(rc>1?(i+1):'')+'</a>'; }).join('・')+'</p>';
    } else if(!closed){
      h+='<p class="sub" style="color:#8a4a00">⚠ 未附憑證</p>';
    }
    h+='<button class="ghost" style="margin-top:6px;padding:7px;font-size:12.5px" onclick="reqUpStart(\''+r.ref+'\')">📎 補傳憑證</button>';
    if(r.note && !closed) h+='<p class="sub">'+esc(r.note)+'</p>';
    d.id='req-'+r.ref;
    if(r.status==='待匯款' && user==='允甄')
      h+='<button class="btn" style="margin-top:8px" onclick="confirmPay(\''+r.ref+'\')">已匯款(今日)— 自動入帳</button>';
    if(r.status==='已匯款' && user==='凌華')
      h+='<button class="btn" style="margin-top:8px" onclick="reqClose(\''+r.ref+'\')">已通知廠商,結案</button>';
    d.innerHTML=h; el.appendChild(d);
  }

  var ORDER = user==='允甄'
    ? [['待匯款','⏳ 待你匯款',1],['已匯款','📣 已匯款・待凌華通知廠商',0]]
    : [['已匯款','📣 已匯款・待你通知廠商後結案',1],['待匯款','⏳ 允甄匯款處理中',0]];
  ORDER.forEach(function(g){
    var rows=lastData.reqs.filter(function(r){ return r.status===g[0]; });
    if(!rows.length){
      if(g[2]) head(g[1]+':目前沒有 ✓', 0);
      return;
    }
    head(g[1]+'('+rows.length+')', g[2]);
    rows.forEach(buildCard);
  });

  var closedRows = lastData.reqs.filter(function(r){ return r.status==='已結案'; });
  if(closedRows.length){
    var main = closedRows.filter(function(r){ return String(r.pool).indexOf('[主]')===0; });
    var priv = closedRows.filter(function(r){ return String(r.pool).indexOf('[主]')!==0; });
    if(main.length){ head('✓ 已結案・🔵 會費帳('+main.length+')', 0, '#0C447C'); main.forEach(buildCard); }
    if(priv.length){ head('✓ 已結案・🟣 私帳('+priv.length+')', 0, '#3C3489'); priv.forEach(buildCard); }
  }
}

function catGuard(catEl, teamId){
  var teamEl = document.getElementById(teamId);
  if(!teamEl) return;
  var lock = (catEl.value==='球秘請款' || catEl.value==='球秘執行費');
  if(lock){ teamEl.value='創主班'; teamEl.disabled=true; toast('球秘支出=創主班支出,隊伍已鎖定'); }
  else teamEl.disabled=false;
}

function readPhoto(inp){
  var f=inp.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){ photoData={ b64: rd.result.split(',')[1], mime: f.type }; toast('照片已附加'); };
  rd.readAsDataURL(f);
}

    var en0={
      date: document.getElementById('fDate').value.replace(/-/g,''),
      pool: poolEl0?poolEl0.value:cur.pool,
      team: document.getElementById('fTeamE').value,
      cat: document.getElementById('fCat').value,
      desc: desc0,
      act: document.getElementById('fAct').value.trim(),
      income: dir==='in'?amt:'', expense: dir==='out'?amt:'',
      refType: refT,
      status: dir==='out'?(refT?'已撥款':'已支付'):'—',
      note:''
    };
    if(photoData){ en0.photoBase64=photoData.b64; en0.photoMime=photoData.mime; }
    var btn0=document.getElementById('saveBtn'); btn0.disabled=true; btn0.textContent='儲存中…';
    api({action:'add',entry:en0}).then(function(j){
      toast('已入帳 '+j.txnId+(j.ref?'|'+j.ref:''));
      btn0.disabled=false; btn0.textContent='儲存並登入總帳';
      document.getElementById('fAmt').value=''; photoData=null;
      var fp0=document.getElementById('fPhoto'); if(fp0) fp0.value='';
      refresh();
    }).catch(function(e){ toast('失敗:'+e.message); btn0.disabled=false; btn0.textContent='儲存並登入總帳'; });
    return;
  }
  if(cur.pair){
    var nEl=document.getElementById('fNote');
    var btn0=document.getElementById('saveBtn'); btn0.disabled=true; btn0.textContent='成對入帳中…';
    api({action:'sponsorTransfer',amount:amt,
      date:document.getElementById('fDate').value.replace(/-/g,''),
      note:nEl?nEl.value.trim():''}).then(function(j){
      toast('已成對入帳 '+j.ref+'(私池支出+球隊帳贊助收入)');
      btn0.disabled=false; btn0.textContent='儲存並登入總帳';
      document.getElementById('fAmt').value='';
      refresh();
    }).catch(function(e){ toast('失敗:'+e.message); btn0.disabled=false; btn0.textContent='儲存並登入總帳'; });
    return;
  }
  if(cur.dgift){
    var dEl=document.getElementById('fDesc');
    if(!dEl.value.trim()){ toast('請填明細'); return; }
    var btn1=document.getElementById('saveBtn'); btn1.disabled=true; btn1.textContent='成對入帳中…';
    api({action:'directGift', amount:amt,
      date:document.getElementById('fDate').value.replace(/-/g,''),
      desc:dEl.value.trim(),
      team:document.getElementById('fTeamE').value,
      cat:document.getElementById('fCat').value}).then(function(){
      toast('✓ 會長直付已成對入帳(淨0不影響勾稽)');
      btn1.disabled=false; btn1.textContent='儲存並登入總帳';
      document.getElementById('fAmt').value=''; dEl.value='';
      refresh();
    }).catch(function(e){ toast('失敗:'+e.message); btn1.disabled=false; btn1.textContent='儲存並登入總帳'; });
    return;
  }
  var payerEl=document.getElementById('fPayer');
  if(cur.payer && payerEl && !payerEl.value.trim()){ toast('收入需填繳款人姓名'); return; }
  var catEl=document.getElementById('fCat'), poolEl=document.getElementById('fPool'), teamEl=document.getElementById('fTeamE');
  var desc=document.getElementById('fDesc').value || cur.t;
  if(payerEl && payerEl.value) desc += '('+payerEl.value.trim()+')';
  var refM=document.getElementById('fRefM');
  var actEl=document.getElementById('fAct');
  var en={
    act: actEl?actEl.value.trim():'',
    date: document.getElementById('fDate').value.replace(/-/g,''),
    pool: poolEl?poolEl.value:cur.pool,
    team: teamEl?teamEl.value:cur.team,
    cat: catEl?catEl.value:cur.cat,
    desc: desc,
    income: cur.dir>0?amt:'',
    expense: cur.dir<0?amt:'',
    refType: cur.ref||'',
    status: cur.dir<0?(cur.ref?'已撥款':'已支付'):'—',
    note: refM&&refM.value?('對應 '+refM.value):''
  };
  if(photoData){ en.photoBase64=photoData.b64; en.photoMime=photoData.mime; }
  var btn=document.getElementById('saveBtn'); btn.disabled=true; btn.textContent='儲存中…';
  api({action:'add',entry:en}).then(function(j){
    toast('已入帳 '+j.txnId+(j.ref?'|'+j.ref:''));
    btn.disabled=false; btn.textContent='儲存並登入總帳';
    document.getElementById('fAmt').value=''; photoData=null;
    var fp=document.getElementById('fPhoto'); if(fp) fp.value='';
    refresh();
  }).catch(function(e){ toast('失敗:'+e.message); btn.disabled=false; btn.textContent='儲存並登入總帳'; });
}

function refresh(){
  api({action:'summary'}).then(function(j){
    lastData=j;
    pendCount = (j.reqs||[]).filter(function(r){
      return (user==='允甄'&&r.status==='待匯款')||(user==='凌華'&&r.status==='已匯款');
    }).length;
    navBadge();
    var acts={};
    (j.recent||[]).forEach(function(r){ if(!r.voided&&r.act) acts[r.act]=1; });
    document.getElementById('actList').innerHTML =
      Object.keys(acts).sort().map(function(a){return '<option value="'+esc(a)+'">'}).join('');
    if(curTab==='home') renderHome();
    if(curTab==='det') renderDetail();
    if(curTab==='recon') renderRecon();
    if(!document.getElementById('ovSec').classList.contains('hide')) renderOverview();
    if(!document.getElementById('paySec').classList.contains('hide')) renderReqs();
    if(!document.getElementById('pubSec').classList.contains('hide')) renderPub();
    handleDeepLink();
    ['[主]會費池','[私]Lina贊助池','[私]花零用金池'].forEach(function(p,i){
      document.getElementById('b'+i).textContent = money(j.balances[p]);
      var rc=(j.recon||{})[p], badge=document.getElementById('rb'+i);
      if(badge) badge.textContent = rc ? ('✓對帳至'+String(rc.date).slice(4,6)+'/'+String(rc.date).slice(6,8)) : '';
    });
    var lg=document.getElementById('log'); lg.innerHTML='';
    j.recent.slice(0,3).forEach(function(r){
      var d=document.createElement('div');
      d.className='item'+(r.voided?' voided':'');
      d.innerHTML='<div class="top"><span>'+esc(r.desc)+'</span>'+
        '<span class="'+(r.income?'amt-in':'amt-out')+'">'+(r.income?'+'+money(r.income):'−'+money(r.expense))+'</span></div>'+
        '<div class="chips"><span class="chip c-pool">'+r.pool+'</span><span class="chip c-team">'+r.team+'</span>'+
        '<span class="chip c-cat">'+r.cat+'</span>'+(r.ref?'<span class="chip c-ref">'+r.ref+'</span>':'')+
        '<span class="sub" style="margin-left:auto">'+r.date+'</span></div>';
      lg.appendChild(d);
    });
  }).catch(function(e){ toast('讀取失敗:'+e.message); });
}

if(localStorage.getItem('gf_token')){
  api({action:'whoami'}).then(function(j){ user=j.name; enter(); })
    .catch(function(){ localStorage.removeItem('gf_token'); });
}
</script>
